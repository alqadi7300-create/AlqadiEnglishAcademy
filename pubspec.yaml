name: alqadi_english_academy
description: منصة القاضي للأكاديمية الإنجليزية - Online + Offline learning platform.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  http: ^1.2.2
  file_picker: ^8.3.7
  audioplayers: ^6.1.0
  pdf: ^3.11.3
  printing: ^5.14.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/pdf/
    - assets/fonts/
