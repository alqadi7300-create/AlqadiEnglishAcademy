name: Extract Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="AlqadiEnglishAcademy_ROOT_READY.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found: $ZIP_FILE"
            exit 1
          fi

          rm -rf .project_extract
          mkdir -p .project_extract

          unzip -q -o "$ZIP_FILE" -d .project_extract

          echo "Extracted files:"
          find .project_extract -maxdepth 3 -type f | sort | head -200

          cp -a .project_extract/. .

          rm -rf .project_extract
          rm -f "$ZIP_FILE"

          rm -f README-1.md README-2.md

          echo "Final project root:"
          ls -la

      - name: Commit extracted project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract AlqadiEnglishAcademy project"
          git push
