name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Create Android platform if missing
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "Android folder is missing."
            echo "Creating Android platform..."
            flutter create \
              --platforms=android \
              --org com.alqadi.english \
              --project-name alqadi_english_academy \
              .
          else
            echo "Android folder already exists."
          fi

          echo "Checking Android project..."

          if [ -f "android/app/build.gradle" ]; then
            echo "Found android/app/build.gradle"
          elif [ -f "android/app/build.gradle.kts" ]; then
            echo "Found android/app/build.gradle.kts"
          else
            echo "ERROR: Android Gradle file was not found."
            exit 1
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            find build -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlqadiEnglishAcademy-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
