name: Extract Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="AlqadiEnglishAcademy_ROOT_READY.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found: $ZIP_FILE"
            exit 1
          fi

          rm -rf .project_extract
          mkdir -p .project_extract

          unzip -q -o "$ZIP_FILE" -d .project_extract

          echo "Extracting project files..."

          cp -a .project_extract/. .

          rm -rf .project_extract
          rm -f "$ZIP_FILE"
          rm -f README-1.md
          rm -f README-2.md

          echo "Project extraction completed."

          echo "Checking project structure..."

          test -f pubspec.yaml
          test -d lib
          test -d assets
          test -d firebase
          test -d test

          echo "Project structure OK."

          echo "Repository files:"
          find lib -maxdepth 3 -type f | sort | head -300

      - name: Remove nested workflow before commit
        shell: bash
        run: |
          set -e

          rm -f .github/workflows/build-apk.yml

          echo "Nested build workflow removed temporarily."

      - name: Commit project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Install AlqadiEnglishAcademy project"

      - name: Push project
        shell: bash
        run: |
          set -e

          git push origin HEAD:main
