name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-apk-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: true

      - name: Check Flutter and Java
        run: |
          flutter --version
          java -version

      - name: Regenerate clean Android platform
        run: |
          rm -rf android
          flutter create --platforms=android --project-name alqadi_english_academy .
          # Firebase is registered for this exact Android application id.
          find android -type f \( -name '*.kt' -o -name '*.kts' -o -name '*.xml' \) -print0 | xargs -0 sed -i 's/com\.example\.alqadi_english_academy/com.alqadi.englishacademy/g'
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/namespace = "com\.example\.alqadi_english_academy"/namespace = "com.alqadi.englishacademy"/' android/app/build.gradle.kts
            sed -i 's/applicationId = "com\.example\.alqadi_english_academy"/applicationId = "com.alqadi.englishacademy"/' android/app/build.gradle.kts
          fi
          if [ -f android/app/src/main/kotlin/com/example/alqadi_english_academy/MainActivity.kt ]; then
            mkdir -p android/app/src/main/kotlin/com/alqadi/englishacademy
            mv android/app/src/main/kotlin/com/example/alqadi_english_academy/MainActivity.kt android/app/src/main/kotlin/com/alqadi/englishacademy/MainActivity.kt
            rm -rf android/app/src/main/kotlin/com/example
          fi
          grep -R "applicationId\|namespace" android/app/build.gradle.kts

          # Install the academy identity icon into the generated Android project.
          mkdir -p android/app/src/main/res/drawable
          cp tooling/ic_academy.xml android/app/src/main/res/drawable/ic_academy.xml
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/ic_academy"#' android/app/src/main/AndroidManifest.xml
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        continue-on-error: true
        run: flutter analyze

      - name: Run tests
        continue-on-error: true
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi
          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlqadiEnglishAcademy-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
